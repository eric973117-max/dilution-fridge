<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>全链路量子计算 · 从云端任务到 10 mK 的一个脉冲</title>
  <meta name="description" content="一条从云端任务一路走到量子芯片的完整链路：控制电子学、微波信号链、稀释制冷机、量子处理器、校准与应用。中英双语，滚动叙事。">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="./styles.css?v=51c62595e">
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud__brand">
      <b>全链路量子计算</b>
      <span>FULL-STACK QUANTUM</span>
    </div>
    <div class="hud__now">
      <span class="hud__layer" id="hudLayer">—</span>
      <span class="hud__temp" id="hudTemp">—</span>
    </div>
    <div class="hud__right">
      <button class="hud__lang" id="langBtn" type="button" aria-label="切换语言 / Switch language">EN</button>
      <span class="hud__pct"><span id="hudPct">0</span>%</span>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="层级导航"></nav>
  <div class="cards" id="cards"></div>

  <!-- 覆盖层：依赖图（章节里出现）+ 冷盘标签（挂在零件上的名牌）；
       标注引线由 src/overlays/leaders.js 自己往 body 上挂一个 svg -->
  <div class="overlay overlay--graph" id="overlayGraph">
    <!-- .graph 的宽度与 svg 的缩放由 styles/overlays.css 管，所以里面要再套一层 -->
    <div class="graph" id="graphHost"></div>
  </div>
  <div class="plates" id="plates"></div>

  <div class="stepper" id="stepper">
    <button id="stepBack" type="button" aria-label="后退两步">−</button>
    <button id="stepFwd" type="button" aria-label="前进两步">＋</button>
  </div>

  <main id="scroll"></main>

  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <div class="errbox" id="errbox" hidden></div>

  <script type="module" src="./src/main.js?v=51c62595e"></script>
</body>
</html>
